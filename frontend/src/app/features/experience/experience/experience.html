<section class="page">
  <h1>Experience</h1>

  @if (loading()) {
    <app-loading-spinner />
  } @else if (error(); as errorMessage) {
    <app-error-message [message]="errorMessage" />
  } @else {
    <div class="experience-list">
      @for (item of items(); track item.id) {
        <app-experience-item [item]="item" />
      }
    </div>
  }
</section>
