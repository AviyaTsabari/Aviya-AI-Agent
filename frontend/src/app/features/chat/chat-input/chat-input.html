<div class="composer">
  <label class="prompt" for="chat-draft">&gt;</label>
  <input
    id="chat-draft"
    type="text"
    placeholder="Ask about stack, architecture, a project, or the role you need filled..."
    aria-label="Message Aviya"
    [value]="draft()"
    [disabled]="disabled()"
    (input)="updateDraft($event)"
    (keydown.enter)="submit()"
    autocomplete="off"
  />
  <button type="button" [disabled]="disabled()" (click)="submit()">Send</button>
</div>
